<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eventos – Painel Laços de Amor</title>
<link rel="stylesheet" href="../../css/base.css">
<link rel="stylesheet" href="../../css/admin.css">
</head>
<body>
<header>
  <a href="/" class="logo">🐾 Laços de Amor</a>
  <nav><a href="dashboard.html">Painel</a><a href="animais.html">Animais</a><a href="eventos.html" class="ativo">Eventos</a><a href="voluntarios.html">Voluntários</a><a href="/">Ver site</a><a href="#" id="btn-sair" class="cta">Sair</a></nav>
</header>
<main>
  <div class="aviso" id="aviso" hidden></div>

  <div class="pagehead cabecalho-pagina">
    <div>
      <h2>Eventos e avisos</h2>
      <p class="contagem" id="contagem-eventos">Carregando…</p>
    </div>
    <div class="acoes">
      <button type="button" class="btn" id="btn-novo-evento">+ Cadastrar evento</button>
    </div>
  </div>

  <div class="filtros">
    <div class="campo">
      <label for="filtro-busca">Buscar</label>
      <input type="search" id="filtro-busca" placeholder="Título, local ou descrição">
    </div>
    <div class="campo">
      <label for="filtro-status">Status</label>
      <select id="filtro-status">
        <option value="">Todos</option>
        <option>Publicado</option>
        <option>Rascunho</option>
        <option>Cancelado</option>
      </select>
    </div>
  </div>

  <div class="tabela-caixa">
    <table class="tabela">
      <thead>
        <tr><th>Título</th><th>Data</th><th>Hora</th><th>Local</th><th>Status</th><th>Ações</th></tr>
      </thead>
      <tbody id="corpo-eventos"></tbody>
    </table>
  </div>
</main>

<div class="modal-fundo" id="modal-evento" hidden>
  <div class="modal">
    <h3 id="titulo-modal-evento">Cadastrar novo evento</h3>
    <form id="form-evento" novalidate>
      <input type="hidden" name="id">
      <div class="form-linha">
        <div class="campo largo">
          <label for="titulo">Título *</label>
          <input type="text" id="titulo" name="titulo" maxlength="90" placeholder="Feirinha de Adoção">
          <span class="erro-campo"></span>
        </div>
        <div class="campo">
          <label for="data">Data *</label>
          <input type="date" id="data" name="data">
          <span class="erro-campo"></span>
        </div>
        <div class="campo">
          <label for="hora">Hora *</label>
          <input type="time" id="hora" name="hora">
          <span class="erro-campo"></span>
        </div>
        <div class="campo">
          <label for="local">Local *</label>
          <input type="text" id="local" name="local" maxlength="80" placeholder="IB Bragion">
          <span class="erro-campo"></span>
        </div>
        <div class="campo">
          <label for="status">Status *</label>
          <select id="status" name="status">
            <option value="">Selecione…</option>
            <option>Publicado</option>
            <option>Rascunho</option>
            <option>Cancelado</option>
          </select>
          <span class="erro-campo"></span>
        </div>
        <div class="campo largo">
          <label for="descricao">Descrição</label>
          <textarea id="descricao" name="descricao" maxlength="400" placeholder="O que vai acontecer, o que levar…"></textarea>
          <span class="erro-campo"></span>
        </div>
      </div>
      <div class="form-botoes">
        <button type="submit" class="btn">Salvar</button>
        <button type="button" class="btn ghost" id="btn-cancelar-evento">Cancelar</button>
      </div>
    </form>
  </div>
</div>

<footer class="admin">Laços de Amor · Endereço da ONG · E-mail da ONG</footer>
<script src="../../js/api.js"></script>
<script src="../../js/admin.js"></script>
</body>
</html>
