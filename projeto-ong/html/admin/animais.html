<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Animais – Painel Laços de Amor</title>
<link rel="stylesheet" href="../../css/base.css">
<link rel="stylesheet" href="../../css/admin.css">
</head>
<body>
<header>
  <a href="/" class="logo">🐾 Laços de Amor</a>
  <nav><a href="dashboard.html">Painel</a><a href="animais.html" class="ativo">Animais</a><a href="eventos.html">Eventos</a><a href="voluntarios.html">Voluntários</a><a href="/">Ver site</a><a href="#" id="btn-sair" class="cta">Sair</a></nav>
</header>
<main>
  <div class="aviso" id="aviso" hidden></div>

  <div class="pagehead cabecalho-pagina">
    <div>
      <h2>Animais</h2>
      <p class="contagem" id="contagem-animais">Carregando…</p>
    </div>
    <div class="acoes">
      <button type="button" class="btn" id="btn-novo-animal">+ Cadastrar animal</button>
    </div>
  </div>

  <div class="filtros">
    <div class="campo">
      <label for="filtro-busca">Buscar</label>
      <input type="search" id="filtro-busca" placeholder="Nome, raça ou descrição">
    </div>
    <div class="campo">
      <label for="filtro-especie">Espécie</label>
      <select id="filtro-especie">
        <option value="">Todas</option>
        <option>Cão</option>
        <option>Gato</option>
      </select>
    </div>
    <div class="campo">
      <label for="filtro-status">Status</label>
      <select id="filtro-status">
        <option value="">Todos</option>
        <option>Disponível</option>
        <option>Adotado</option>
      </select>
    </div>
  </div>

  <div class="tabela-caixa">
    <table class="tabela">
      <thead>
        <tr>
          <th>Nome</th><th>Espécie</th><th>Raça</th><th>Idade</th>
          <th>Porte</th><th>Sexo</th><th>Status</th><th>Ações</th>
        </tr>
      </thead>
      <tbody id="corpo-animais"></tbody>
    </table>
  </div>
</main>

<div class="modal-fundo" id="modal-animal" hidden>
  <div class="modal">
    <h3 id="titulo-modal-animal">Cadastrar novo animal</h3>
    <form id="form-animal" novalidate>
      <input type="hidden" name="id">
      <div class="form-linha">
        <div class="campo">
          <label for="nome">Nome *</label>
          <input type="text" id="nome" name="nome" maxlength="60">
          <span class="erro-campo"></span>
        </div>
        <div class="campo">
          <label for="especie">Espécie *</label>
          <select id="especie" name="especie">
            <option value="">Selecione…</option>
            <option>Cão</option>
            <option>Gato</option>
          </select>
          <span class="erro-campo"></span>
        </div>
        <div class="campo">
          <label for="raca">Raça</label>
          <input type="text" id="raca" name="raca" maxlength="40" placeholder="SRD, Poodle…">
          <span class="erro-campo"></span>
        </div>
        <div class="campo">
          <label for="idade">Idade (anos) *</label>
          <input type="number" id="idade" name="idade" min="0" max="40">
          <span class="erro-campo"></span>
        </div>
        <div class="campo">
          <label for="meses">Meses</label>
          <input type="number" id="meses" name="meses" min="0" max="11" value="0" required>
          <span class="erro-campo"></span>
        </div>
        <div class="campo">
          <label for="porte">Porte *</label>
          <select id="porte" name="porte">
            <option value="">Selecione…</option>
            <option>Pequeno</option>
            <option>Médio</option>
            <option>Grande</option>
          </select>
          <span class="erro-campo"></span>
        </div>
        <div class="campo">
          <label for="sexo">Sexo *</label>
          <select id="sexo" name="sexo">
            <option value="">Selecione…</option>
            <option>Macho</option>
            <option>Fêmea</option>
          </select>
          <span class="erro-campo"></span>
        </div>
        <div class="campo">
          <label for="status">Status *</label>
          <select id="status" name="status">
            <option value="">Selecione…</option>
            <option>Disponível</option>
            <option>Adotado</option>
          </select>
          <span class="erro-campo"></span>
        </div>
        <div class="campo largo">
          <label for="descricao">Descrição</label>
          <textarea id="descricao" name="descricao" maxlength="300" placeholder="Temperamento, cuidados, história…"></textarea>
          <span class="erro-campo"></span>
        </div>
        <div class="campo largo">
          <label for="foto">Foto do animal</label>
          <input type="file" id="foto" name="foto" accept="image/jpeg,image/png,image/webp"><span class="erro-campo"></span>
        </div>
      </div>
      <div class="form-botoes">
        <button type="submit" class="btn">Salvar</button>
        <button type="button" class="btn ghost" id="btn-cancelar-animal">Cancelar</button>
      </div>
    </form>
  </div>
</div>

<footer class="admin">Laços de Amor · Endereço da ONG · E-mail da ONG</footer>
<script src="../../js/api.js"></script>
<script src="../../js/admin.js"></script>
</body>
</html>
